code: "cs"
language: "Czech"
endonym: "Čeština"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Dobrý den"
        say: "DOH-bree den"
        en: "Hello / Good day"
        nl: "Hallo / Goedendag"
      - phrase: "Na shledanou"
        say: "NAHS-khleh-dah-noh"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Prosím"
        say: "PROH-seem"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Děkuji"
        say: "DYEH-koo-yee"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Promiňte"
        say: "PROH-meeny-teh"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Ano / Ne"
        say: "AH-noh / neh"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Nerozumím"
        say: "NEH-roh-zoo-meem"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Mluvíte anglicky?"
        say: "MLOO-vee-teh AHN-glits-kee"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Kde je…?"
        say: "gdeh yeh"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Jednu jízdenku do…"
        say: "YED-noo YEEZ-den-koo doh"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Kolik to stojí?"
        say: "KOH-leek toh STOH-yee"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Doleva / doprava / rovně"
        say: "DOH-leh-vah / DOH-prah-vah / ROHV-nyeh"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "Nádraží"
        say: "NAH-drah-zhee"
        en: "The station"
        nl: "Het station"
      - phrase: "Toalety"
        say: "TOH-ah-leh-tee"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Stůl pro dva, prosím"
        say: "stool proh dvah, PROH-seem"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Jídelní lístek, prosím"
        say: "YEE-del-nyee LEES-tek, PROH-seem"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Dám si…"
        say: "dahm see"
        en: "I'll have…"
        nl: "Ik neem…"
      - phrase: "Vodu, prosím"
        say: "VOH-doo, PROH-seem"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Zaplatím, prosím"
        say: "ZAH-plah-tyeem, PROH-seem"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Jsem vegetarián(ka)"
        say: "sem VEH-geh-tah-ree-ahn (-kah)"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Na zdraví!"
        say: "NAHZ-drah-vee"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Kolik stojí tohle?"
        say: "KOH-leek STOH-yee TOH-hleh"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Můžu platit kartou?"
        say: "MOO-zhoo PLAH-tyit KAR-toh"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "To je moc drahé"
        say: "toh yeh mots DRAH-heh"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Jen se dívám"
        say: "yen seh DYEE-vahm"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Pomoc!"
        say: "POH-mots"
        en: "Help!"
        nl: "Help!"
      - phrase: "Zavolejte doktora!"
        say: "ZAH-voh-lay-teh DOK-toh-rah"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "Lékárna"
        say: "LEH-kahr-nah"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Ztratil(a) jsem se"
        say: "STRAH-tyil (-ah) sem seh"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Mám alergii na…"
        say: "mahm AH-lehr-ghee-yee nah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "jeden", say: "YEH-den"}
  - {n: 2, word: "dva", say: "dvah"}
  - {n: 3, word: "tři", say: "trzhee"}
  - {n: 4, word: "čtyři", say: "CHTI-rzhee"}
  - {n: 5, word: "pět", say: "pyet"}
  - {n: 6, word: "šest", say: "shest"}
  - {n: 7, word: "sedm", say: "SEH-dum"}
  - {n: 8, word: "osm", say: "OH-sum"}
  - {n: 9, word: "devět", say: "DEH-vyet"}
  - {n: 10, word: "deset", say: "DEH-set"}
  - {n: 20, word: "dvacet", say: "DVAH-tset"}
  - {n: 50, word: "padesát", say: "PAH-deh-saht"}
  - {n: 100, word: "sto", say: "stoh"}
