code: "de"
language: "German"
endonym: "Deutsch"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Guten Tag"
        say: "GOO-ten tahk"
        en: "Hello / Good day"
        nl: "Hallo / Goedendag"
      - phrase: "Auf Wiedersehen"
        say: "owf VEE-der-zay-en"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Bitte"
        say: "BIT-teh"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Danke"
        say: "DAHN-keh"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Entschuldigung"
        say: "ent-SHOOL-dee-goong"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Ja / Nein"
        say: "yah / nine"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Ich verstehe nicht"
        say: "ikh fer-SHTAY-eh nikht"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Sprechen Sie Englisch?"
        say: "SHPREKH-en zee ENG-lish"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Wo ist…?"
        say: "voh ist"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Eine Fahrkarte nach…"
        say: "EYE-neh FAHR-kar-teh nahkh"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Was kostet das?"
        say: "vahs KOS-tet dahs"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Links / rechts / geradeaus"
        say: "links / rekhts / geh-RAH-deh-ows"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "Der Bahnhof"
        say: "dehr BAHN-hohf"
        en: "The station"
        nl: "Het station"
      - phrase: "Die Toilette"
        say: "dee toy-LET-teh"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Einen Tisch für zwei, bitte"
        say: "EYE-nen tish fewr tsvy, BIT-teh"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Die Speisekarte, bitte"
        say: "dee SHPY-zeh-kar-teh, BIT-teh"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Ich hätte gern…"
        say: "ikh HET-teh gehrn"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Wasser, bitte"
        say: "VAHS-ser, BIT-teh"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Die Rechnung, bitte"
        say: "dee REKH-noong, BIT-teh"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Ich bin Vegetarier(in)"
        say: "ikh bin veh-geh-TAH-ree-er"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Prost!"
        say: "prohst"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Wie viel kostet das hier?"
        say: "vee FEEL KOS-tet dahs heer"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Kann ich mit Karte zahlen?"
        say: "kahn ikh mit KAR-teh TSAH-len"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "Das ist zu teuer"
        say: "dahs ist tsoo TOY-er"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Ich schaue nur"
        say: "ikh SHOW-eh noor"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Hilfe!"
        say: "HIL-feh"
        en: "Help!"
        nl: "Help!"
      - phrase: "Rufen Sie einen Arzt!"
        say: "ROO-fen zee EYE-nen ahrtst"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "Die Apotheke"
        say: "dee ah-poh-TAY-keh"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Ich habe mich verlaufen"
        say: "ikh HAH-beh mikh fer-LOW-fen"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Ich bin allergisch gegen…"
        say: "ikh bin ah-LEHR-gish GAY-gen"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
