code: "el"
language: "Greek"
endonym: "Ελληνικά"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Γεια σας"
        say: "YAH sahs"
        en: "Hello"
        nl: "Hallo"
      - phrase: "Αντίο"
        say: "ahn-DEE-oh"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Παρακαλώ"
        say: "pah-rah-kah-LOH"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Ευχαριστώ"
        say: "ef-khah-ree-STOH"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Συγγνώμη"
        say: "seeg-NOH-mee"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Ναι / Όχι"
        say: "neh / OH-khee"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Δεν καταλαβαίνω"
        say: "dhen kah-tah-lah-VEH-noh"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Μιλάτε αγγλικά;"
        say: "mee-LAH-teh ahng-glee-KAH"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Πού είναι…;"
        say: "poo EE-neh"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Ένα εισιτήριο για…"
        say: "EH-nah ee-see-TEE-ree-oh yah"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Πόσο κάνει;"
        say: "POH-soh KAH-nee"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Αριστερά / δεξιά / ευθεία"
        say: "ah-ree-steh-RAH / dhek-SYAH / ef-THEE-ah"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "Ο σταθμός"
        say: "oh stahth-MOHS"
        en: "The station"
        nl: "Het station"
      - phrase: "Η τουαλέτα"
        say: "ee twah-LEH-tah"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Ένα τραπέζι για δύο, παρακαλώ"
        say: "EH-nah trah-PEH-zee yah DHEE-oh, pah-rah-kah-LOH"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Τον κατάλογο, παρακαλώ"
        say: "tohn kah-TAH-loh-ghoh, pah-rah-kah-LOH"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Θα ήθελα…"
        say: "thah EE-theh-lah"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Νερό, παρακαλώ"
        say: "neh-ROH, pah-rah-kah-LOH"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Τον λογαριασμό, παρακαλώ"
        say: "tohn loh-ghar-yahz-MOH, pah-rah-kah-LOH"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Είμαι χορτοφάγος"
        say: "EE-meh khor-toh-FAH-ghohs"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Στην υγειά μας!"
        say: "steen ee-YAH mahs"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Πόσο κάνει αυτό;"
        say: "POH-soh KAH-nee ahf-TOH"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Μπορώ να πληρώσω με κάρτα;"
        say: "boh-ROH nah plee-ROH-soh meh KAR-tah"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "Είναι πολύ ακριβό"
        say: "EE-neh poh-LEE ah-kree-VOH"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Απλώς κοιτάζω"
        say: "ah-PLOHS kee-TAH-zoh"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Βοήθεια!"
        say: "voh-EE-thee-ah"
        en: "Help!"
        nl: "Help!"
      - phrase: "Καλέστε έναν γιατρό!"
        say: "kah-LES-teh EH-nahn yah-TROH"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "Το φαρμακείο"
        say: "toh far-mah-KEE-oh"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Έχω χαθεί"
        say: "EH-khoh khah-THEE"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Είμαι αλλεργικός/ή σε…"
        say: "EE-meh ah-ler-yee-KOHS (-KEE) seh"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "ένα", say: "EH-nah"}
  - {n: 2, word: "δύο", say: "DHEE-oh"}
  - {n: 3, word: "τρία", say: "TREE-ah"}
  - {n: 4, word: "τέσσερα", say: "TEH-seh-rah"}
  - {n: 5, word: "πέντε", say: "PEN-deh"}
  - {n: 6, word: "έξι", say: "EK-see"}
  - {n: 7, word: "επτά", say: "ep-TAH"}
  - {n: 8, word: "οκτώ", say: "ohk-TOH"}
  - {n: 9, word: "εννέα", say: "eh-NEH-ah"}
  - {n: 10, word: "δέκα", say: "DHEH-kah"}
  - {n: 20, word: "είκοσι", say: "EE-koh-see"}
  - {n: 50, word: "πενήντα", say: "peh-NEEN-dah"}
  - {n: 100, word: "εκατό", say: "eh-kah-TOH"}
