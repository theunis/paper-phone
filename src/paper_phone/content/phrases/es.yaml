code: "es"
language: "Spanish"
endonym: "Español"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Hola"
        say: "OH-lah"
        en: "Hello"
        nl: "Hallo"
      - phrase: "Adiós"
        say: "ah-DYOHS"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Por favor"
        say: "por fah-VOR"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Gracias"
        say: "GRAH-thyahs"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Perdón"
        say: "pehr-DOHN"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Sí / No"
        say: "see / noh"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "No entiendo"
        say: "noh en-TYEN-doh"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "¿Habla inglés?"
        say: "AH-blah een-GLEHS"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "¿Dónde está…?"
        say: "DOHN-deh es-TAH"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Un billete para…"
        say: "oon bee-YEH-teh PAH-rah"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "¿Cuánto cuesta?"
        say: "KWAHN-toh KWES-tah"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Izquierda / derecha / recto"
        say: "eeth-KYEHR-dah / deh-REH-chah / REK-toh"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "La estación"
        say: "lah es-tah-THYOHN"
        en: "The station"
        nl: "Het station"
      - phrase: "El baño"
        say: "el BAH-nyoh"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Una mesa para dos, por favor"
        say: "OO-nah MEH-sah PAH-rah dohs, por fah-VOR"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "La carta, por favor"
        say: "lah KAR-tah, por fah-VOR"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Quisiera…"
        say: "kee-SYEH-rah"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Agua, por favor"
        say: "AH-gwah, por fah-VOR"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "La cuenta, por favor"
        say: "lah KWEN-tah, por fah-VOR"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Soy vegetariano/a"
        say: "soy beh-heh-tah-RYAH-noh"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "¡Salud!"
        say: "sah-LOOD"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "¿Cuánto cuesta esto?"
        say: "KWAHN-toh KWES-tah ES-toh"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "¿Puedo pagar con tarjeta?"
        say: "PWEH-doh pah-GAR kohn tar-HEH-tah"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "Es demasiado caro"
        say: "es deh-mah-SYAH-doh KAH-roh"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Solo estoy mirando"
        say: "SOH-loh es-TOY mee-RAHN-doh"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "¡Socorro!"
        say: "soh-KOH-rroh"
        en: "Help!"
        nl: "Help!"
      - phrase: "¡Llame a un médico!"
        say: "YAH-meh ah oon MEH-dee-koh"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "La farmacia"
        say: "lah far-MAH-thyah"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Me he perdido"
        say: "meh eh pehr-DEE-doh"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Soy alérgico/a a…"
        say: "soy ah-LEHR-hee-koh ah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "uno", say: "OO-noh"}
  - {n: 2, word: "dos", say: "dohs"}
  - {n: 3, word: "tres", say: "trehs"}
  - {n: 4, word: "cuatro", say: "KWAH-troh"}
  - {n: 5, word: "cinco", say: "THEEN-koh"}
  - {n: 6, word: "seis", say: "says"}
  - {n: 7, word: "siete", say: "SYEH-teh"}
  - {n: 8, word: "ocho", say: "OH-choh"}
  - {n: 9, word: "nueve", say: "NWEH-veh"}
  - {n: 10, word: "diez", say: "dyeth"}
  - {n: 20, word: "veinte", say: "BAYN-teh"}
  - {n: 50, word: "cincuenta", say: "theen-KWEN-tah"}
  - {n: 100, word: "cien", say: "thyen"}
