code: "fr"
language: "French"
endonym: "Français"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Bonjour"
        say: "bohn-ZHOOR"
        en: "Hello / Good day"
        nl: "Hallo / Goedendag"
      - phrase: "Au revoir"
        say: "oh ruh-VWAHR"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "S’il vous plaît"
        say: "seel voo PLEH"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Merci"
        say: "mehr-SEE"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Pardon"
        say: "par-DOHN"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Oui / Non"
        say: "wee / nohn"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Je ne comprends pas"
        say: "zhuh nuh kohm-prahn PAH"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Parlez-vous anglais ?"
        say: "par-lay-voo ahn-GLEH"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Où est… ?"
        say: "oo EH"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Un billet pour…"
        say: "uhn bee-YEH poor"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "C’est combien ?"
        say: "seh kohm-BYAN"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "À gauche / à droite / tout droit"
        say: "ah GOHSH / ah DRWAHT / too DRWAH"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "La gare"
        say: "lah GAHR"
        en: "The station"
        nl: "Het station"
      - phrase: "Les toilettes"
        say: "lay twah-LET"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Une table pour deux, s’il vous plaît"
        say: "ewn tahbl poor DUH, seel voo PLEH"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "La carte, s’il vous plaît"
        say: "lah KART, seel voo PLEH"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Je voudrais…"
        say: "zhuh voo-DREH"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "De l’eau, s’il vous plaît"
        say: "duh LOH, seel voo PLEH"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "L’addition, s’il vous plaît"
        say: "lah-dee-SYOHN, seel voo PLEH"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Je suis végétarien(ne)"
        say: "zhuh swee vay-zhay-tah-RYAN (-RYEN)"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Santé !"
        say: "sahn-TAY"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Combien ça coûte ?"
        say: "kohm-byan sah KOOT"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Je peux payer par carte ?"
        say: "zhuh puh peh-yay par KART"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "C’est trop cher"
        say: "seh troh SHEHR"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Je regarde seulement"
        say: "zhuh ruh-gard suhl-MAHN"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Au secours !"
        say: "oh suh-KOOR"
        en: "Help!"
        nl: "Help!"
      - phrase: "Appelez un médecin !"
        say: "ah-play uhn mayd-SAN"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "La pharmacie"
        say: "lah far-mah-SEE"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Je suis perdu(e)"
        say: "zhuh swee pehr-DEW"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Je suis allergique à…"
        say: "zhuh swee ah-lehr-ZHEEK ah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
