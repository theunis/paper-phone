code: "hr"
language: "Croatian"
endonym: "Hrvatski"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Dobar dan"
        say: "DOH-bar dahn"
        en: "Hello / Good day"
        nl: "Hallo / Goedendag"
      - phrase: "Doviđenja"
        say: "doh-vee-JEH-nyah"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Molim"
        say: "MOH-leem"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Hvala"
        say: "HVAH-lah"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Oprostite"
        say: "oh-PROH-stee-teh"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Da / Ne"
        say: "dah / neh"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Ne razumijem"
        say: "neh rah-ZOO-mee-yem"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Govorite li engleski?"
        say: "GOH-voh-ree-teh lee EN-gleh-skee"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Gdje je…?"
        say: "gdyeh yeh"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Jednu kartu za…"
        say: "YED-noo KAR-too zah"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Koliko košta?"
        say: "KOH-lee-koh KOSH-tah"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Lijevo / desno / ravno"
        say: "LYEH-voh / DES-noh / RAHV-noh"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "Kolodvor"
        say: "KOH-loh-dvor"
        en: "The station"
        nl: "Het station"
      - phrase: "Toalet"
        say: "toh-AH-let"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Stol za dvoje, molim"
        say: "stohl zah DVOH-yeh, MOH-leem"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Jelovnik, molim"
        say: "yeh-LOHV-neek, MOH-leem"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Mogu li dobiti…?"
        say: "MOH-goo lee DOH-bee-tee"
        en: "Could I have…?"
        nl: "Mag ik…?"
      - phrase: "Vodu, molim"
        say: "VOH-doo, MOH-leem"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Račun, molim"
        say: "RAH-choon, MOH-leem"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Ne jedem meso"
        say: "neh YEH-dem MEH-soh"
        en: "I don't eat meat"
        nl: "Ik eet geen vlees"
      - phrase: "Živjeli!"
        say: "ZHEE-vyeh-lee"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Koliko ovo košta?"
        say: "KOH-lee-koh OH-voh KOSH-tah"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Mogu li platiti karticom?"
        say: "MOH-goo lee PLAH-tee-tee KAR-tee-tsohm"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "Preskupo je"
        say: "PREH-skoo-poh yeh"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Samo gledam"
        say: "SAH-moh GLEH-dahm"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Upomoć!"
        say: "OO-poh-mohch"
        en: "Help!"
        nl: "Help!"
      - phrase: "Pozovite liječnika!"
        say: "POH-zoh-vee-teh LYECH-nee-kah"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "Ljekarna"
        say: "LYEH-kar-nah"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Izgubio/la sam se"
        say: "eez-GOO-bee-oh (-lah) sahm seh"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Imam alergiju na…"
        say: "EE-mahm ah-LEHR-ghee-yoo nah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "jedan", say: "YEH-dahn"}
  - {n: 2, word: "dva", say: "dvah"}
  - {n: 3, word: "tri", say: "tree"}
  - {n: 4, word: "četiri", say: "CHEH-tee-ree"}
  - {n: 5, word: "pet", say: "pet"}
  - {n: 6, word: "šest", say: "shest"}
  - {n: 7, word: "sedam", say: "SEH-dahm"}
  - {n: 8, word: "osam", say: "OH-sahm"}
  - {n: 9, word: "devet", say: "DEH-vet"}
  - {n: 10, word: "deset", say: "DEH-set"}
  - {n: 20, word: "dvadeset", say: "DVAH-deh-set"}
  - {n: 50, word: "pedeset", say: "peh-DEH-set"}
  - {n: 100, word: "sto", say: "stoh"}
