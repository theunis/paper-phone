code: "it"
language: "Italian"
endonym: "Italiano"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Buongiorno"
        say: "bwohn-JOR-noh"
        en: "Hello / Good day"
        nl: "Hallo / Goedendag"
      - phrase: "Arrivederci"
        say: "ah-ree-veh-DEHR-chee"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Per favore"
        say: "pehr fah-VOH-reh"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Grazie"
        say: "GRAHT-tsyeh"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Mi scusi"
        say: "mee SKOO-zee"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Sì / No"
        say: "see / noh"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Non capisco"
        say: "nohn kah-PEES-koh"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Parla inglese?"
        say: "PAR-lah een-GLEH-zeh"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Dov’è…?"
        say: "doh-VEH"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Un biglietto per…"
        say: "oon bee-LYET-toh pehr"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Quanto costa?"
        say: "KWAHN-toh KOS-tah"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Sinistra / destra / dritto"
        say: "see-NEES-trah / DES-trah / DREET-toh"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "La stazione"
        say: "lah staht-TSYOH-neh"
        en: "The station"
        nl: "Het station"
      - phrase: "Il bagno"
        say: "eel BAH-nyoh"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Un tavolo per due, per favore"
        say: "oon TAH-voh-loh pehr DOO-eh, pehr fah-VOH-reh"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Il menù, per favore"
        say: "eel meh-NOO, pehr fah-VOH-reh"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Vorrei…"
        say: "vor-RAY"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Acqua, per favore"
        say: "AHK-kwah, pehr fah-VOH-reh"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Il conto, per favore"
        say: "eel KOHN-toh, pehr fah-VOH-reh"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Sono vegetariano/a"
        say: "SOH-noh veh-jeh-tah-RYAH-noh"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Salute!"
        say: "sah-LOO-teh"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Quanto costa questo?"
        say: "KWAHN-toh KOS-tah KWES-toh"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Posso pagare con la carta?"
        say: "POS-soh pah-GAH-reh kohn lah KAR-tah"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "È troppo caro"
        say: "eh TROP-poh KAH-roh"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Sto solo guardando"
        say: "stoh SOH-loh gwar-DAHN-doh"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Aiuto!"
        say: "ah-YOO-toh"
        en: "Help!"
        nl: "Help!"
      - phrase: "Chiami un medico!"
        say: "KYAH-mee oon MEH-dee-koh"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "La farmacia"
        say: "lah far-mah-CHEE-ah"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Mi sono perso/a"
        say: "mee SOH-noh PEHR-soh"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Sono allergico/a a…"
        say: "SOH-noh ahl-LEHR-jee-koh ah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "uno", say: "OO-noh"}
  - {n: 2, word: "due", say: "DOO-eh"}
  - {n: 3, word: "tre", say: "treh"}
  - {n: 4, word: "quattro", say: "KWAHT-troh"}
  - {n: 5, word: "cinque", say: "CHEEN-kweh"}
  - {n: 6, word: "sei", say: "say"}
  - {n: 7, word: "sette", say: "SET-teh"}
  - {n: 8, word: "otto", say: "OT-toh"}
  - {n: 9, word: "nove", say: "NOH-veh"}
  - {n: 10, word: "dieci", say: "DYEH-chee"}
  - {n: 20, word: "venti", say: "VEN-tee"}
  - {n: 50, word: "cinquanta", say: "cheen-KWAHN-tah"}
  - {n: 100, word: "cento", say: "CHEN-toh"}
