code: "ja"
language: "Japanese"
endonym: "日本語"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "こんにちは"
        romaji: "konnichiwa"
        say: "kon-nee-chee-wah"
        en: "Hello"
        nl: "Hallo"
      - phrase: "さようなら"
        romaji: "sayōnara"
        say: "sah-yoh-nah-rah"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "お願いします"
        romaji: "onegai shimasu"
        say: "oh-neh-gai shee-mahs"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "ありがとうございます"
        romaji: "arigatō gozaimasu"
        say: "ah-ree-gah-toh goh-zai-mahs"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "すみません"
        romaji: "sumimasen"
        say: "soo-mee-mah-sen"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "はい / いいえ"
        romaji: "hai / iie"
        say: "hai / ee-eh"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "わかりません"
        romaji: "wakarimasen"
        say: "wah-kah-ree-mah-sen"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "英語は話せますか？"
        romaji: "eigo wa hanasemasu ka?"
        say: "ay-goh wah hah-nah-seh-mahs kah"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "〜はどこですか？"
        romaji: "… wa doko desu ka?"
        say: "wah doh-koh dess kah"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "〜までの切符をください"
        romaji: "… made no kippu o kudasai"
        say: "mah-deh noh keep-poo oh koo-dah-sai"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "いくらですか？"
        romaji: "ikura desu ka?"
        say: "ee-koo-rah dess kah"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "左 / 右 / まっすぐ"
        romaji: "hidari / migi / massugu"
        say: "hee-dah-ree / mee-gee / mahs-soo-goo"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "駅"
        romaji: "eki"
        say: "eh-kee"
        en: "The station"
        nl: "Het station"
      - phrase: "トイレ"
        romaji: "toire"
        say: "toy-reh"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "二人お願いします"
        romaji: "futari onegai shimasu"
        say: "foo-tah-ree oh-neh-gai shee-mahs"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "メニューをお願いします"
        romaji: "menyū o onegai shimasu"
        say: "meh-nyoo oh oh-neh-gai shee-mahs"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "〜をください"
        romaji: "… o kudasai"
        say: "oh koo-dah-sai"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "お水をください"
        romaji: "omizu o kudasai"
        say: "oh-mee-zoo oh koo-dah-sai"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "お会計をお願いします"
        romaji: "okaikei o onegai shimasu"
        say: "oh-kai-kay oh oh-neh-gai shee-mahs"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "ベジタリアンです"
        romaji: "bejitarian desu"
        say: "beh-jee-tah-ree-ahn dess"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "乾杯！"
        romaji: "kanpai!"
        say: "kahn-pai"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "これはいくらですか？"
        romaji: "kore wa ikura desu ka?"
        say: "koh-reh wah ee-koo-rah dess kah"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "カードで払えますか？"
        romaji: "kādo de haraemasu ka?"
        say: "kah-doh deh hah-rah-eh-mahs kah"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "高すぎます"
        romaji: "takasugimasu"
        say: "tah-kah-soo-gee-mahs"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "見ているだけです"
        romaji: "mite iru dake desu"
        say: "mee-teh ee-roo dah-keh dess"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "助けて！"
        romaji: "tasukete!"
        say: "tahs-keh-teh"
        en: "Help!"
        nl: "Help!"
      - phrase: "医者を呼んでください"
        romaji: "isha o yonde kudasai"
        say: "ee-shah oh yohn-deh koo-dah-sai"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "薬局"
        romaji: "yakkyoku"
        say: "yahk-kyoh-koo"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "道に迷いました"
        romaji: "michi ni mayoimashita"
        say: "mee-chee nee mah-yoy-mahsh-tah"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "〜アレルギーです"
        romaji: "… arerugī desu"
        say: "ah-reh-roo-gee dess"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "一", say: "ee-chee"}
  - {n: 2, word: "二", say: "nee"}
  - {n: 3, word: "三", say: "sahn"}
  - {n: 4, word: "四", say: "yohn"}
  - {n: 5, word: "五", say: "goh"}
  - {n: 6, word: "六", say: "roh-koo"}
  - {n: 7, word: "七", say: "nah-nah"}
  - {n: 8, word: "八", say: "hah-chee"}
  - {n: 9, word: "九", say: "kyoo"}
  - {n: 10, word: "十", say: "joo"}
  - {n: 20, word: "二十", say: "nee-joo"}
  - {n: 50, word: "五十", say: "goh-joo"}
  - {n: 100, word: "百", say: "hyah-koo"}
