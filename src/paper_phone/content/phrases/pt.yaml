code: "pt"
language: "Portuguese"
endonym: "Português"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Olá / Bom dia"
        say: "oh-LAH / bong DEE-ah"
        en: "Hello / Good morning"
        nl: "Hallo / Goedemorgen"
      - phrase: "Adeus"
        say: "ah-DEH-oosh"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Por favor"
        say: "poor fah-VOR"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Obrigado/a"
        say: "oh-bree-GAH-doo (-dah)"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Desculpe"
        say: "desh-KOOL-puh"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Sim / Não"
        say: "seeng / nowng"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Não percebo"
        say: "nowng pur-SAY-boo"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "Fala inglês?"
        say: "FAH-lah eeng-GLAYSH"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "Onde fica…?"
        say: "OHN-duh FEE-kah"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "Um bilhete para…"
        say: "oong bee-LYEH-tuh PAH-rah"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Quanto custa?"
        say: "KWAHN-too KOOSH-tah"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Esquerda / direita / em frente"
        say: "ish-KEHR-dah / dee-RAY-tah / ayng FREN-tuh"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "A estação"
        say: "ah ish-tah-SOWNG"
        en: "The station"
        nl: "Het station"
      - phrase: "A casa de banho"
        say: "ah KAH-zah duh BAH-nyoo"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "Uma mesa para dois, por favor"
        say: "OO-mah MAY-zah PAH-rah doysh, poor fah-VOR"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "A ementa, por favor"
        say: "ah ee-MEN-tah, poor fah-VOR"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "Queria…"
        say: "kuh-REE-ah"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Água, por favor"
        say: "AH-gwah, poor fah-VOR"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "A conta, por favor"
        say: "ah KOHN-tah, poor fah-VOR"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Sou vegetariano/a"
        say: "soh vuh-zhuh-tah-RYAH-noo"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Saúde!"
        say: "sah-OO-duh"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Quanto custa isto?"
        say: "KWAHN-too KOOSH-tah EESH-too"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Posso pagar com cartão?"
        say: "POH-soo pah-GAR kohng kar-TOWNG"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "É demasiado caro"
        say: "eh duh-mah-ZYAH-doo KAH-roo"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Estou só a ver"
        say: "ish-TOH soh ah VEHR"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "Socorro!"
        say: "soo-KOH-roo"
        en: "Help!"
        nl: "Help!"
      - phrase: "Chame um médico!"
        say: "SHAH-muh oong MEH-dee-koo"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "A farmácia"
        say: "ah far-MAH-syah"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Estou perdido/a"
        say: "ish-TOH pur-DEE-doo"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "Sou alérgico/a a…"
        say: "soh ah-LEHR-zhee-koo ah"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "um", say: "oong"}
  - {n: 2, word: "dois", say: "doysh"}
  - {n: 3, word: "três", say: "traysh"}
  - {n: 4, word: "quatro", say: "KWAH-troo"}
  - {n: 5, word: "cinco", say: "SEENG-koo"}
  - {n: 6, word: "seis", say: "saysh"}
  - {n: 7, word: "sete", say: "SEH-tuh"}
  - {n: 8, word: "oito", say: "OY-too"}
  - {n: 9, word: "nove", say: "NOH-vuh"}
  - {n: 10, word: "dez", say: "desh"}
  - {n: 20, word: "vinte", say: "VEENG-tuh"}
  - {n: 50, word: "cinquenta", say: "seeng-KWEN-tah"}
  - {n: 100, word: "cem", say: "sayng"}
