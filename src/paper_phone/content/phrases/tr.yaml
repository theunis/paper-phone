code: "tr"
language: "Turkish"
endonym: "Türkçe"
sections:
  - title: "Basics"
    title_nl: "Basis"
    phrases:
      - phrase: "Merhaba"
        say: "MEHR-hah-bah"
        en: "Hello"
        nl: "Hallo"
      - phrase: "Hoşça kalın"
        say: "HOSH-chah KAH-luhn"
        en: "Goodbye"
        nl: "Tot ziens"
      - phrase: "Lütfen"
        say: "LEWT-fen"
        en: "Please"
        nl: "Alstublieft"
      - phrase: "Teşekkür ederim"
        say: "teh-shek-KEWR eh-deh-reem"
        en: "Thank you"
        nl: "Dank u wel"
      - phrase: "Affedersiniz"
        say: "ahf-feh-DEHR-see-neez"
        en: "Excuse me / Sorry"
        nl: "Pardon / Sorry"
      - phrase: "Evet / Hayır"
        say: "eh-VET / HAH-yuhr"
        en: "Yes / No"
        nl: "Ja / Nee"
      - phrase: "Anlamıyorum"
        say: "ahn-LAH-muh-yoh-room"
        en: "I don't understand"
        nl: "Ik begrijp het niet"
      - phrase: "İngilizce biliyor musunuz?"
        say: "een-gee-LEEZ-jeh bee-lee-YOR moo-soo-nooz"
        en: "Do you speak English?"
        nl: "Spreekt u Engels?"
  - title: "Getting around"
    title_nl: "Onderweg"
    phrases:
      - phrase: "… nerede?"
        say: "NEH-reh-deh"
        en: "Where is…?"
        nl: "Waar is…?"
      - phrase: "… için bir bilet"
        say: "ee-CHEEN beer bee-LET"
        en: "A ticket to…"
        nl: "Een kaartje naar…"
      - phrase: "Ne kadar?"
        say: "NEH kah-dahr"
        en: "How much is it?"
        nl: "Hoeveel kost het?"
      - phrase: "Sol / sağ / düz"
        say: "sohl / saah / dewz"
        en: "Left / right / straight on"
        nl: "Links / rechts / rechtdoor"
      - phrase: "İstasyon"
        say: "ees-tahs-YOHN"
        en: "The station"
        nl: "Het station"
      - phrase: "Tuvalet"
        say: "too-vah-LET"
        en: "The toilet"
        nl: "Het toilet"
  - title: "Eating & drinking"
    title_nl: "Eten & drinken"
    phrases:
      - phrase: "İki kişilik masa, lütfen"
        say: "ee-KEE kee-shee-LEEK mah-SAH, LEWT-fen"
        en: "A table for two, please"
        nl: "Een tafel voor twee, graag"
      - phrase: "Menü, lütfen"
        say: "meh-NEW, LEWT-fen"
        en: "The menu, please"
        nl: "De menukaart, graag"
      - phrase: "… istiyorum"
        say: "ees-TEE-yoh-room"
        en: "I'd like…"
        nl: "Ik wil graag…"
      - phrase: "Su, lütfen"
        say: "soo, LEWT-fen"
        en: "Water, please"
        nl: "Water, graag"
      - phrase: "Hesap, lütfen"
        say: "heh-SAHP, LEWT-fen"
        en: "The bill, please"
        nl: "De rekening, graag"
      - phrase: "Vejetaryenim"
        say: "veh-zheh-tahr-YEH-neem"
        en: "I'm vegetarian"
        nl: "Ik ben vegetariër"
      - phrase: "Şerefe!"
        say: "sheh-reh-FEH"
        en: "Cheers!"
        nl: "Proost!"
  - title: "Shopping & money"
    title_nl: "Winkelen & geld"
    phrases:
      - phrase: "Bu ne kadar?"
        say: "boo NEH kah-dahr"
        en: "How much is this?"
        nl: "Hoeveel kost dit?"
      - phrase: "Kartla ödeyebilir miyim?"
        say: "KART-lah ur-deh-yeh-bee-LEER mee-yeem"
        en: "Can I pay by card?"
        nl: "Kan ik met kaart betalen?"
      - phrase: "Çok pahalı"
        say: "chohk pah-hah-LUH"
        en: "It's too expensive"
        nl: "Het is te duur"
      - phrase: "Sadece bakıyorum"
        say: "SAH-deh-jeh bah-KUH-yoh-room"
        en: "I'm just looking"
        nl: "Ik kijk alleen even"
  - title: "Help & health"
    title_nl: "Hulp & gezondheid"
    phrases:
      - phrase: "İmdat!"
        say: "eem-DAHT"
        en: "Help!"
        nl: "Help!"
      - phrase: "Doktor çağırın!"
        say: "dohk-TOHR chaa-uh-RUHN"
        en: "Call a doctor!"
        nl: "Bel een dokter!"
      - phrase: "Eczane"
        say: "ej-zah-NEH"
        en: "The pharmacy"
        nl: "De apotheek"
      - phrase: "Kayboldum"
        say: "kai-bohl-DOOM"
        en: "I'm lost"
        nl: "Ik ben verdwaald"
      - phrase: "… alerjim var"
        say: "ah-lehr-ZHEEM vahr"
        en: "I'm allergic to…"
        nl: "Ik ben allergisch voor…"
numbers:
  - {n: 1, word: "bir", say: "beer"}
  - {n: 2, word: "iki", say: "ee-KEE"}
  - {n: 3, word: "üç", say: "ewch"}
  - {n: 4, word: "dört", say: "durt"}
  - {n: 5, word: "beş", say: "besh"}
  - {n: 6, word: "altı", say: "ahl-TUH"}
  - {n: 7, word: "yedi", say: "yeh-DEE"}
  - {n: 8, word: "sekiz", say: "seh-KEEZ"}
  - {n: 9, word: "dokuz", say: "doh-KOOZ"}
  - {n: 10, word: "on", say: "ohn"}
  - {n: 20, word: "yirmi", say: "yeer-MEE"}
  - {n: 50, word: "elli", say: "el-LEE"}
  - {n: 100, word: "yüz", say: "yewz"}
