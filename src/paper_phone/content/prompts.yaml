offline:
  - "Find the oldest building on your street and guess its age."
  - "Write a letter by hand to someone who would never expect one."
  - "Cook a meal using only what's already in your cupboards."
  - "Draw the view from your window without lifting your pen."
  - "Learn the name of one tree you walk past every day."
  - "Fix something small that has been broken for months."
  - "Pick up a book you abandoned and read one more chapter."
  - "Empty one messy drawer and put back only what you use."
  - "Sit outside for five minutes and count the different birds you hear."
  - "Play a game with a real deck of cards. Solitaire counts."
  - "Write down every song you remember from when you were twelve."
  - "Plant a lemon pip or an avocado stone and see if it grows."
  - "Bake something that makes the whole kitchen smell good."
  - "Sit on a bench for fifteen minutes and watch who walks by."
  - "Fold a paper plane and adjust it until it crosses the room."
  - "Rearrange your bookshelf in a new order and see if you like it."
  - "Wash one window until you can see the street clearly again."
  - "Draw a map of the streets around your home from memory."
  - "Borrow a library book from a shelf you've never browsed."
  - "Make a pot of tea and drink it before it goes cold."
  - "Stretch on the floor for ten minutes with no music on."
  - "Write down the recipe for a dish only you know how to make."
  - "Sew on a loose button or patch a hole in something you love."
  - "Flip through an old photo album and pick the photo you like best."
  - "Move one piece of furniture and live with the new layout for a day."
  - "Teach yourself to juggle with three rolled-up pairs of socks."
  - "Do a crossword in pen. No looking up answers."
  - "List ten things you'd like to learn, then start on one."
  - "Walk into a shop you've passed a hundred times but never entered."
  - "Clean and polish your shoes until they shine."
  - "Build a boat, a house or a castle out of cardboard."
  - "Water your plants and check which one needs a bigger pot."
  - "Write a note to yourself and hide it somewhere to find next year."
  - "Learn to tie a bowline, then tie it with your eyes shut."
  - "Buy a newspaper and read it front to back, ads included."
  - "Pick up litter along one street and enjoy the difference."
  - "Lie on your back and find shapes in the clouds."
  - "Write your name and address with your other hand."
  - "Make breakfast for dinner, with all the trimmings."
  - "Return something you borrowed ages ago, in person."

reflect:
  - "What would make today feel well spent?"
  - "What were you about to check your phone for just now?"
  - "Which conversation from this week keeps coming back to you?"
  - "What are you putting off, and what's the smallest first step?"
  - "When did you last lose track of time? What were you doing?"
  - "What have you changed your mind about this year?"
  - "Describe an ordinary Tuesday you'd be happy to repeat."
  - "What would your ten-year-old self find surprising about your life?"
  - "What small thing went right today?"
  - "Which worry from last month turned out fine?"
  - "What do you do that makes other people's days easier?"
  - "Where do you feel most like yourself?"
  - "What skill would you like to have in five years?"
  - "Write about a meal you still remember clearly."
  - "Does your body need rest, food or movement right now?"
  - "What are you looking forward to this week?"
  - "Which compliment have you never forgotten?"
  - "What did you notice today that you'd normally miss?"
  - "What could you say no to this week?"
  - "Who taught you something important without knowing it?"
  - "What's the best advice you've ignored so far?"
  - "Describe a smell that takes you straight back to childhood."
  - "What does a good weekend look like for you?"
  - "When were you last properly bored, and what came out of it?"
  - "What in this room are you glad to own?"
  - "What would you tell yourself from a year ago?"
  - "What are you proud of that nobody else saw?"
  - "Which friend do you miss, and what would you tell them?"
  - "What did you spend money on recently that was worth every cent?"
  - "What does 'enough' look like for you right now?"
  - "What's the kindest thing you could do for yourself tonight?"
  - "What have you been curious about lately?"
  - "Write down a small rule you live by."
  - "What makes you laugh even when you're tired?"
  - "Which place would you like to go back to, and why?"
  - "How did the first hour without your phone feel?"
  - "What do you want more of in your days, and what less?"
  - "Which song fits this week best?"
  - "What are you better at than you admit?"
  - "What did you do today purely because you wanted to?"

connect:
  - "What's a small thing that made your week better?"
  - "What did you want to be when you were little?"
  - "What's the best meal you've ever had, and where was it?"
  - "If you could live somewhere else for one year, where would it be?"
  - "What have you learned recently that surprised you?"
  - "Which family recipe or tradition would you like to keep alive?"
  - "Which teacher do you still think about, and why?"
  - "What's the worst job you've ever had?"
  - "What book or film do you keep recommending?"
  - "What's the strangest thing you believed as a kid?"
  - "What would you do with a free Saturday and no plans?"
  - "What skill would you love someone to teach you?"
  - "Which song takes you straight back to one particular summer?"
  - "What's the kindest thing a stranger has done for you?"
  - "Which of your habits would surprise people?"
  - "What's coming up this month that you're excited about?"
  - "What's the best trip you've taken on a small budget?"
  - "What did your grandparents do for work?"
  - "Which hobby did you drop that you'd pick up again?"
  - "Where did you grow up, and how has it changed?"
  - "What's the most useful advice you've had at work?"
  - "What would your perfect Sunday breakfast be?"
  - "What's a risk you took that paid off?"
  - "What's something you're quietly good at?"
  - "What was the first concert you went to?"
  - "What smell reminds you of home?"
  - "What would you do with one extra hour every day?"
  - "What question do you wish people asked you more often?"
  - "Who in your life makes you laugh the most?"
  - "What's the best thing you've made with your hands?"
  - "What were you obsessed with at fifteen?"
  - "Which invention would you happily un-invent?"
  - "What do you cook when friends come over?"
  - "Which local spot deserves more visitors?"
  - "How did you spend your last completely free day?"
  - "Is there a tradition you started yourself?"
  - "What would you put in a time capsule to open in 2050?"
  - "Which animal would you most like to see in the wild?"
  - "How did your parents meet?"
  - "What's the story behind your name?"

adventure:
  - "Take the first bus that comes and get off after six stops."
  - "Walk to the edge of your town and see what's on the other side."
  - "Watch the sunrise from the highest spot you can reach on foot."
  - "Follow a river or canal for an hour and see where it leads."
  - "Eat lunch in a part of town you've never been to."
  - "Walk home by a route you've never taken."
  - "Visit a museum and spend the whole time in one room."
  - "Climb the nearest hill and eat something at the top."
  - "Swim outdoors somewhere safe, if the weather lets you."
  - "Go to a market and buy a fruit you've never tasted."
  - "Take a train to a town you only know from station announcements."
  - "Walk until you find a bench with a view, then stay a while."
  - "Cycle to the next village and have a coffee there."
  - "Wander through an old cemetery and find the oldest gravestone."
  - "Pack a thermos and have a picnic somewhere unexpected."
  - "At every corner, flip a coin for left or right. Walk for an hour."
  - "Buy the oddest thing in a secondhand shop for less than a coffee."
  - "After dark, find the darkest spot nearby and count the stars."
  - "Take a ferry, cable car or tram you've never ridden before."
  - "Walk in the rain on purpose, without an umbrella."
  - "Find a free concert or choir rehearsal and listen in."
  - "In the nearest woods, take the narrowest path you can find."
  - "Step inside a church, mosque or temple you've only walked past."
  - "Find the best view of your town and sketch it."
  - "Sit in the station hall and watch departures for twenty minutes."
  - "Walk a route shaped like the first letter of your name."
  - "Skim stones on a lake or beach until one bounces five times."
  - "Buy a ticket for the next film showing, whatever it is."
  - "Go down to the waterfront and watch the boats come and go."
  - "Pick a street name you like on a map and go find it."
  - "Visit a farm shop and cook dinner from whatever you bring home."
  - "Walk to a place you only know from the car window."
  - "Find the nearest ruin, old fort or city wall and explore it."
  - "Visit a botanical garden and hunt for the strangest plant."
  - "Hike until you reach a spot where you can't hear traffic."
  - "Join a drop-in class for a sport you've never tried."
  - "Go to a flea market with a small budget and one thing to find."
  - "Get off one stop early and explore the walk from there."
  - "Watch the sunset from a bridge and stay until the streetlights come on."
  - "Ask your town's tourist office what to do, then do it."
